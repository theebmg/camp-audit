<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Camp Sychar Audit (Postgres preview)</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Small additions specific to this preview build — kept separate from the
       shared style.css so the live app's stylesheet is never touched. */
    :root { color-scheme: light; } /* forces native form controls (incl. the
      unstylable <select> dropdown popup) to render with light/dark-legible
      colors regardless of OS dark mode — without this, some browsers draw the
      popup with a dark background but don't flip the text color to match. */
    .pg-banner {
      background: var(--pop-soft); color: #7c2d12; font-size: 0.82rem; font-weight: 600;
      padding: 8px 16px; text-align: center; border-bottom: 1px solid var(--border);
    }
    .field-row { margin-bottom: 16px; }
    .field-row label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .field-row select, .field-row input, .field-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem; font-family: inherit; background: var(--surface); color: var(--text);
    }
    .field-row textarea { min-height: 70px; resize: vertical; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 8px; cursor: pointer; }
    .list-item:hover { background: var(--surface-alt); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      background: var(--surface-alt); color: var(--muted); }
    .pill.good { background: var(--accent-soft); color: var(--accent-dark); }
    .pill.warn { background: var(--warn-soft); color: #92400e; }
    .pill.bad { background: var(--danger-soft); color: #991b1b; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: var(--radius-sm); border: none;
      font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-secondary { background: var(--surface-alt); color: var(--text); }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .reveal { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--border); }
    table.report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.report-table th, table.report-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.report-table tr.clickable-row { cursor: pointer; }
    table.report-table tr.clickable-row:hover { background: var(--surface-alt); }
    .summary-buckets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .bucket-tile { flex: 1; min-width: 110px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px; text-align: center; }
    .bucket-tile .n { font-size: 1.4rem; font-weight: 800; }
    .note-item { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-alt); margin-bottom: 8px; }
    .note-item.resolved { opacity: 0.55; text-decoration: line-through; }
  </style>
</head>
<body>
  <div class="pg-banner">🚧 Postgres migration preview — separate database from the main app, safe to click around</div>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">🏕️ <span>Camp Sychar (pg)</span></span>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close">&times;</button>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser"></div>
        <button id="logoutBtn" class="sidebar-logout" hidden>Log Out</button>
      </div>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" hidden>&#9776;</button>
        <button id="backBtn" class="icon-btn" hidden>&larr;</button>
        <h1 id="pageTitle">Camp Sychar Audit</h1>
      </header>
      <div class="global-search" id="globalSearchWrap" hidden>
        <input type="text" id="globalSearch" placeholder="Search locations & assets…" autocomplete="off" />
        <div class="global-search-results" id="globalSearchResults" hidden></div>
      </div>
      <nav id="breadcrumbs" class="breadcrumbs" hidden></nav>
      <main id="app"></main>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
