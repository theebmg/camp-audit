<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Camp Sychar Audit (Postgres preview)</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Small additions specific to this preview build — kept separate from the
       shared style.css so the live app's stylesheet is never touched. */
    /* color-scheme (light vs dark, for native form-control legibility incl.
       the unstylable <select> dropdown popup) is now set per-theme-state in
       the shared style.css, alongside the Theme picker in the sidebar. */
    .pg-banner {
      background: var(--pop-soft); color: #7c2d12; font-size: 0.82rem; font-weight: 600;
      padding: 8px 16px; text-align: center; border-bottom: 1px solid var(--border);
    }
    .field-row { margin-bottom: 16px; }
    .field-row label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .field-row select, .field-row input, .field-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem; font-family: inherit; background: var(--surface); color: var(--text);
    }
    .field-row textarea { min-height: 70px; resize: vertical; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 8px; cursor: pointer; }
    .list-item:hover { background: var(--surface-alt); }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* Locations list — fixed columns so the type pill and Edit button land in
       the same spot on every row, instead of shifting with pill-text width. */
    .list-item.loc-row { display: grid; grid-template-columns: 1fr 110px 90px; gap: 10px; }
    .loc-row .pill { text-align: center; }
    .loc-row .edit-location { text-align: center; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      background: var(--surface-alt); color: var(--muted); }
    .pill.good { background: var(--accent-soft); color: var(--accent-dark); }
    .pill.pop { background: var(--pop-soft); color: #9a3412; }
    .pill.warn { background: var(--warn-soft); color: #92400e; }
    .pill.bad { background: var(--danger-soft); color: #991b1b; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: var(--radius-sm); border: none;
      font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease; }
    .btn:hover { filter: brightness(0.95); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-secondary { background: var(--surface-alt); color: var(--text); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    /* In-page confirm dialog — replaces window.confirm()'s native prompt. */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 12, 20, 0.5); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: modalFadeIn 0.15s ease;
    }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-md); padding: 20px; max-width: 420px; width: 100%;
      animation: modalPopIn 0.15s ease;
    }
    .modal-message { margin: 0; white-space: pre-wrap; line-height: 1.4; }
    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPopIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .reveal { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--border); }

    /* Text links inside tables (e.g. Locations grid view) — themed accent
       color instead of the browser's default blue, which read poorly
       against the dark theme's background. */
    table.report-table a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    table.report-table a:hover { text-decoration: underline; }

    /* A floating "+" action button, top-right of the page — used where a
       primary "add" action shouldn't get lost at the bottom of a long list. */
    .fab {
      position: fixed; top: 74px; right: 20px; z-index: 50;
      width: auto; margin-top: 0;
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 640px) { .fab { top: auto; bottom: 20px; right: 16px; } }

    /* Dashboard "this week" calendar strip */
    .cal-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-strip-day {
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 6px;
      min-height: 76px; cursor: pointer; transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .cal-strip-day:hover { background: var(--surface-alt); box-shadow: var(--shadow-sm); }
    .cal-strip-today { border-color: var(--accent); background: var(--accent-soft); }
    .cal-strip-selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-strip-dow { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .cal-strip-num { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
    .cal-strip-event {
      font-size: 0.72rem; background: var(--surface-alt); border-radius: 6px; padding: 2px 5px;
      margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bucket-tile.clickable-tile { cursor: pointer; }

    /* Theme picker — sidebar footer, above the signed-in-as line */
    .theme-picker { margin-bottom: 12px; }
    .theme-picker .view-toggle { width: 100%; }
    .theme-picker .view-toggle-btn { flex: 1; }
    .accent-swatches { display: flex; gap: 8px; margin-top: 8px; }
    .accent-swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
      padding: 0; transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .accent-swatch:hover { transform: scale(1.12); }
    .accent-swatch.active { border-color: var(--text); }

    /* Admin hub — category cards that stack left-to-right, wrapping down as
       the viewport allows. */
    .admin-category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .admin-category-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px 18px; cursor: pointer; box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .admin-category-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent); }
    .admin-category-icon { font-size: 2rem; margin-bottom: 8px; }
    .admin-category-card h3 { margin: 0 0 4px; }

    /* Capital Plan budget charts — scoped tokens per the dataviz method, kept
       separate from the app's own --accent/--pop/etc. so a chart's identity
       colors never depend on which page they're rendered next to. */
    .viz-root {
      --viz-series-1: #2a78d6; --viz-series-2: #eb6834; --viz-series-3: #1baf7a;
      --viz-status-good: #0ca30c; --viz-status-warning: #fab219; --viz-status-serious: #ec835a; --viz-status-critical: #d03b3b;
      --viz-track: #e1e0d9; --viz-ink: var(--text); --viz-ink-muted: var(--muted);
    }
    :root:not([data-theme="light"]) .viz-root {
      --viz-series-1: #3987e5; --viz-series-2: #d95926; --viz-series-3: #199e70;
      --viz-status-good: #0ca30c; --viz-status-warning: #fab219; --viz-status-serious: #ec835a; --viz-status-critical: #d03b3b;
      --viz-track: #2c2c2a;
    }
    :root[data-theme="dark"] .viz-root {
      --viz-series-1: #3987e5; --viz-series-2: #d95926; --viz-series-3: #199e70;
      --viz-track: #2c2c2a;
    }
    .viz-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .viz-bar-label { width: 130px; flex-shrink: 0; font-size: 0.85rem; color: var(--viz-ink-muted); text-align: right; }
    .viz-bar-track { flex: 1; height: 22px; background: var(--viz-track); border-radius: 4px; position: relative; overflow: visible; }
    .viz-bar-fill {
      height: 100%; border-radius: 0 4px 4px 0; min-width: 3px;
      transition: width 0.3s ease; cursor: pointer;
    }
    .viz-bar-fill.viz-bar-full { border-radius: 4px; }
    .viz-bar-value { margin-left: 8px; font-size: 0.85rem; font-weight: 700; color: var(--viz-ink); white-space: nowrap; }
    .viz-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.8rem; color: var(--viz-ink-muted); }
    .viz-legend-key { display: inline-flex; align-items: center; gap: 5px; }
    .viz-legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .viz-meter-track { height: 28px; background: var(--viz-track); border-radius: 6px; overflow: hidden; position: relative; }
    .viz-meter-fill { height: 100%; border-radius: 0 6px 6px 0; transition: width 0.3s ease; }
    .viz-meter-fill.viz-meter-full { border-radius: 6px; }
    .viz-meter-caption { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.82rem; color: var(--viz-ink-muted); }
    .viz-tooltip {
      position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md); padding: 8px 10px; font-size: 0.8rem; pointer-events: none; z-index: 60;
      white-space: nowrap; opacity: 0; transition: opacity 0.1s ease;
    }
    .viz-tooltip.visible { opacity: 1; }
    .viz-tooltip .viz-tooltip-value { font-weight: 800; color: var(--viz-ink); }

    /* Capital Plan's budget cards were stretching to the full (now-widened)
       page width, which looked awkward for content that isn't naturally that
       wide. Cap the group's width, center it, and let cards go two-wide when
       there's room. */
    .budget-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 16px; max-width: 1000px; margin: 0 auto 16px;
    }
    .budget-grid .card { margin-bottom: 0; }
    @media (max-width: 640px) { .cal-strip { grid-template-columns: repeat(7, minmax(0,1fr)); } .cal-strip-event { display: none; } }

    /* Motion: cards/list-items/nav get a soft hover + a fade-in when a view
       swaps in — the thing that actually makes an app feel "fluid" vs. flat. */
    .card, .list-item, .nav-item { transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    .list-item:hover { background: var(--surface-alt); box-shadow: var(--shadow-sm); }
    @keyframes viewFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    #app.view-fade { animation: viewFadeIn 0.2s ease; }
    .field-row select:focus, .field-row input:focus, .field-row textarea:focus {
      outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    }

    .loading-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); padding: 32px 0; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    table.report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.report-table th, table.report-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.report-table tr.clickable-row { cursor: pointer; transition: background-color 0.15s ease; }
    table.report-table tr.clickable-row:hover { background: var(--surface-alt); }

    /* Applicability Matrix only — inherently a 2D grid, so it keeps a sticky
       first column + horizontal scroll rather than the card-mode toggle. */
    .matrix-table th:first-child, .matrix-table td:first-child {
      position: sticky; left: 0; background: var(--surface); z-index: 1;
    }
    .matrix-table th { white-space: nowrap; }
    .matrix-table input[type="checkbox"], input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

    /* Table/Cards view toggle — Maintenance Log, Capital Plan, Crew & Locations.
       Default
       picked by screen width on first visit; overridden choice persists via
       localStorage (see getTableViewMode() in app.js). */
    .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm);
      overflow: hidden; margin-bottom: 12px; }
    .view-toggle-btn { padding: 7px 14px; border: none; background: var(--surface); color: var(--muted);
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
    .view-toggle-btn.active { background: var(--accent-soft); color: var(--accent-dark); }
    table.report-table.card-mode thead { display: none; }
    table.report-table.card-mode, table.report-table.card-mode tbody,
    table.report-table.card-mode tr, table.report-table.card-mode td { display: block; width: 100%; }
    table.report-table.card-mode tr { margin-bottom: 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
    table.report-table.card-mode td { border: none; padding: 3px 0; }
    table.report-table.card-mode td::before {
      content: attr(data-label); font-weight: 600; color: var(--muted); display: inline-block; min-width: 108px;
    }
    table.report-table.card-mode td[data-label=""]::before { display: none; }

    .summary-buckets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .bucket-tile { flex: 1; min-width: 110px; background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center;
      cursor: pointer; transition: all 0.15s ease; }
    .bucket-tile:hover { box-shadow: var(--shadow-sm); }
    .bucket-tile.active { box-shadow: var(--shadow-md); background: var(--surface-alt); }
    .bucket-tile.tile-bad { border-left-color: var(--danger); }
    .bucket-tile.tile-pop { border-left-color: var(--pop); }
    .bucket-tile.tile-warn { border-left-color: var(--warn); }
    .bucket-tile.tile-good { border-left-color: var(--accent); }
    .bucket-tile.tile-neutral { border-left-color: var(--muted); }
    .bucket-tile .n { font-size: 1.4rem; font-weight: 800; }
    .note-item { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-alt); margin-bottom: 8px; }
    .note-item.resolved { opacity: 0.55; text-decoration: line-through; }

    /* Asset combobox — searchable, typeable, creatable. Always queries the
       live DB (see searchAssetsLive in db.js), so a newly-added asset shows
       up in every picker immediately, no stale cached list anywhere. */
    .ac-wrap { position: relative; }
    .ac-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
      max-height: 240px; overflow-y: auto; margin-top: 4px; }
    .ac-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--surface-alt); }
    .ac-item.ac-add { color: var(--accent-dark); font-weight: 700; }
    .ac-item.ac-empty { cursor: default; color: var(--muted); }
    .ac-item.ac-empty:hover { background: none; }
    .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .skill-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); font-size: 0.82rem; cursor: pointer; user-select: none; background: var(--surface); }
    .skill-chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
    /* Shared style.css's .toast hardcodes white text on a var(--text)
       background — in dark mode --text flips light, leaving white-on-white.
       Override here (scoped to /next/ only, shared file untouched) with the
       correctly-paired surface/text tokens, which invert together properly. */
    .toast { background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--border); }
    /* .field-row's generic `input { width: 100% }` clashes with flex layouts
       like this one — force it back to auto so flex:1/flex:0 actually control
       sizing instead of both children fighting over 100% width. */
    .inline-add-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .inline-add-row select, .inline-add-row input { flex: 1 1 0%; width: 0 !important; min-width: 0; }
    .inline-add-row .btn { flex: 0 0 auto !important; width: auto !important; white-space: nowrap; }

    /* Calendar/scheduler — the calendar is the main feature here: it gets a
       generous share of the (now-widened) page width, with an unscheduled-WO
       sidebar alongside it rather than stacked below on wide screens. */
    .cal-header { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
    .cal-header h3 { margin: 0; min-width: 200px; text-align: center; }
    .cal-layout { display: flex; gap: 18px; align-items: flex-start; }
    .cal-main { flex: 3; min-width: 0; }
    .cal-sidebar { flex: 1; min-width: 240px; max-width: 340px; }
    @media (max-width: 900px) { .cal-layout { flex-direction: column; } .cal-sidebar { max-width: none; width: 100%; } }
    .cal-scroll { overflow-x: auto; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(100px, 1fr)); gap: 1px;
      background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .cal-head { background: var(--surface-alt); padding: 6px 8px; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-align: center; }
    .cal-cell { background: var(--surface); min-height: 120px; padding: 6px; cursor: pointer; transition: background-color 0.15s ease; }
    .cal-cell:hover { background: var(--surface-alt); }
    .cal-cell.cal-empty { background: var(--bg); cursor: default; }
    .cal-cell.cal-empty:hover { background: var(--bg); }
    .cal-cell.cal-today { background: var(--accent-soft); }
    .cal-daynum { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .cal-entry { cursor: pointer; margin-bottom: 3px; }
    .cal-entry .pill { display: block; text-align: left; white-space: normal; line-height: 1.3; }

    /* Day slide-out panel — opened by clicking a day cell's background. */
    .day-panel-overlay { position: fixed; inset: 0; background: rgba(10, 12, 20, 0.35); z-index: 900; animation: modalFadeIn 0.15s ease; }
    .day-panel {
      position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 92vw);
      background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-md);
      z-index: 901; overflow-y: auto; padding: 20px; animation: dayPanelSlideIn 0.2s ease;
    }
    .day-panel-entry { cursor: pointer; }
    @keyframes dayPanelSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  </style>
  <script>
    // Applied before body paints, so there's no flash of the wrong theme or
    // accent color. ACCENT_PRESETS is duplicated (small) in app.js, which
    // owns the picker UI and re-applies the right variant when the theme
    // toggle changes — this copy only needs to render the very first frame.
    window.ACCENT_PRESETS = {
      green:  { light: ['#10b981', '#059669', '#d1fae5', '#ffffff'], dark: ['#34d399', '#10b981', '#163628', '#0b1410'] },
      blue:   { light: ['#3b82f6', '#2563eb', '#dbeafe', '#ffffff'], dark: ['#60a5fa', '#3b82f6', '#1e3a5f', '#0b1420'] },
      purple: { light: ['#8b5cf6', '#7c3aed', '#ede9fe', '#ffffff'], dark: ['#a78bfa', '#8b5cf6', '#2e1f4d', '#160f26'] },
      orange: { light: ['#f97316', '#ea580c', '#ffedd5', '#ffffff'], dark: ['#fb923c', '#f97316', '#3a2413', '#1f1206'] },
      rose:   { light: ['#f43f5e', '#e11d48', '#ffe4e6', '#ffffff'], dark: ['#fb7185', '#f43f5e', '#3a1520', '#1f0a0f'] },
    };
    (function () {
      try {
        var theme = localStorage.getItem('campAuditTheme'); // 'light' | 'dark' | null (system)
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        var resolved = theme === 'light' || theme === 'dark' ? theme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var accentKey = localStorage.getItem('campAuditAccent');
        var preset = accentKey && window.ACCENT_PRESETS[accentKey];
        if (preset) {
          var v = preset[resolved];
          var root = document.documentElement.style;
          root.setProperty('--accent', v[0]); root.setProperty('--accent-dark', v[1]);
          root.setProperty('--accent-soft', v[2]); root.setProperty('--accent-text', v[3]);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="pg-banner">🚧 Postgres migration preview — separate database from the main app, safe to click around</div>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">🏕️ <span>Camp Sychar (pg)</span></span>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close">&times;</button>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
      <div class="sidebar-footer">
        <div class="theme-picker" id="themePicker"></div>
        <div class="sidebar-user" id="sidebarUser"></div>
        <button id="logoutBtn" class="sidebar-logout" hidden>Log Out</button>
      </div>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" hidden>&#9776;</button>
        <button id="backBtn" class="icon-btn" hidden>&larr;</button>
        <h1 id="pageTitle">Camp Sychar Audit</h1>
      </header>
      <div class="global-search" id="globalSearchWrap" hidden>
        <input type="text" id="globalSearch" placeholder="Search locations & assets…" autocomplete="off" />
        <div class="global-search-results" id="globalSearchResults" hidden></div>
      </div>
