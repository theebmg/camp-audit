<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Camp Sychar Audit (Postgres preview)</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Small additions specific to this preview build — kept separate from the
       shared style.css so the live app's stylesheet is never touched. */
    :root { color-scheme: light; } /* forces native form controls (incl. the
      unstylable <select> dropdown popup) to render with light/dark-legible
      colors regardless of OS dark mode — without this, some browsers draw the
      popup with a dark background but don't flip the text color to match. */
    .pg-banner {
      background: var(--pop-soft); color: #7c2d12; font-size: 0.82rem; font-weight: 600;
      padding: 8px 16px; text-align: center; border-bottom: 1px solid var(--border);
    }
    .field-row { margin-bottom: 16px; }
    .field-row label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .field-row select, .field-row input, .field-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem; font-family: inherit; background: var(--surface); color: var(--text);
    }
    .field-row textarea { min-height: 70px; resize: vertical; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 8px; cursor: pointer; }
    .list-item:hover { background: var(--surface-alt); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      background: var(--surface-alt); color: var(--muted); }
    .pill.good { background: var(--accent-soft); color: var(--accent-dark); }
    .pill.pop { background: var(--pop-soft); color: #9a3412; }
    .pill.warn { background: var(--warn-soft); color: #92400e; }
    .pill.bad { background: var(--danger-soft); color: #991b1b; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: var(--radius-sm); border: none;
      font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease; }
    .btn:hover { filter: brightness(0.95); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-secondary { background: var(--surface-alt); color: var(--text); }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .reveal { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--border); }

    /* Motion: cards/list-items/nav get a soft hover + a fade-in when a view
       swaps in — the thing that actually makes an app feel "fluid" vs. flat. */
    .card, .list-item, .nav-item { transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    .list-item:hover { background: var(--surface-alt); box-shadow: var(--shadow-sm); }
    @keyframes viewFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    #app.view-fade { animation: viewFadeIn 0.2s ease; }
    .field-row select:focus, .field-row input:focus, .field-row textarea:focus {
      outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    }

    .loading-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); padding: 32px 0; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    table.report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.report-table th, table.report-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.report-table tr.clickable-row { cursor: pointer; transition: background-color 0.15s ease; }
    table.report-table tr.clickable-row:hover { background: var(--surface-alt); }

    /* Applicability Matrix only — inherently a 2D grid, so it keeps a sticky
       first column + horizontal scroll rather than the card-mode toggle. */
    .matrix-table th:first-child, .matrix-table td:first-child {
      position: sticky; left: 0; background: var(--surface); z-index: 1;
    }
    .matrix-table th { white-space: nowrap; }
    .matrix-table input[type="checkbox"], input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

    /* Table/Cards view toggle — Maintenance Log & Capital Plan only. Default
       picked by screen width on first visit; overridden choice persists via
       localStorage (see getTableViewMode() in app.js). */
    .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm);
      overflow: hidden; margin-bottom: 12px; }
    .view-toggle-btn { padding: 7px 14px; border: none; background: var(--surface); color: var(--muted);
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
    .view-toggle-btn.active { background: var(--accent-soft); color: var(--accent-dark); }
    table.report-table.card-mode thead { display: none; }
    table.report-table.card-mode, table.report-table.card-mode tbody,
    table.report-table.card-mode tr, table.report-table.card-mode td { display: block; width: 100%; }
    table.report-table.card-mode tr { margin-bottom: 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
    table.report-table.card-mode td { border: none; padding: 3px 0; }
    table.report-table.card-mode td::before {
      content: attr(data-label); font-weight: 600; color: var(--muted); display: inline-block; min-width: 108px;
    }
    table.report-table.card-mode td[data-label=""]::before { display: none; }

    .summary-buckets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .bucket-tile { flex: 1; min-width: 110px; background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center;
      cursor: pointer; transition: all 0.15s ease; }
    .bucket-tile:hover { box-shadow: var(--shadow-sm); }
    .bucket-tile.active { box-shadow: var(--shadow-md); background: var(--surface-alt); }
    .bucket-tile.tile-bad { border-left-color: var(--danger); }
    .bucket-tile.tile-pop { border-left-color: var(--pop); }
    .bucket-tile.tile-warn { border-left-color: var(--warn); }
    .bucket-tile.tile-good { border-left-color: var(--accent); }
    .bucket-tile.tile-neutral { border-left-color: var(--muted); }
    .bucket-tile .n { font-size: 1.4rem; font-weight: 800; }
    .note-item { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-alt); margin-bottom: 8px; }
    .note-item.resolved { opacity: 0.55; text-decoration: line-through; }

    /* Asset combobox — searchable, typeable, creatable. Always queries the
       live DB (see searchAssetsLive in db.js), so a newly-added asset shows
       up in every picker immediately, no stale cached list anywhere. */
    .ac-wrap { position: relative; }
    .ac-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
      max-height: 240px; overflow-y: auto; margin-top: 4px; }
    .ac-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--surface-alt); }
    .ac-item.ac-add { color: var(--accent-dark); font-weight: 700; }
    .ac-item.ac-empty { cursor: default; color: var(--muted); }
    .ac-item.ac-empty:hover { background: none; }
    .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .skill-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); font-size: 0.82rem; cursor: pointer; user-select: none; background: var(--surface); }
    .skill-chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
    /* .field-row's generic `input { width: 100% }` clashes with flex layouts
       like this one — force it back to auto so flex:1/flex:0 actually control
       sizing instead of both children fighting over 100% width. */
    .inline-add-row { display: flex; gap: 8px; margin-top: 8px; }
    .inline-add-row input { flex: 1 1 auto; width: auto !important; }
    .inline-add-row .btn { flex: 0 0 auto; }

    /* Calendar/scheduler */
    .cal-scroll { overflow-x: auto; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 1px;
      background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .cal-head { background: var(--surface-alt); padding: 6px 8px; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-align: center; }
    .cal-cell { background: var(--surface); min-height: 90px; padding: 6px; }
    .cal-cell.cal-empty { background: var(--bg); }
    .cal-cell.cal-today { background: var(--accent-soft); }
    .cal-daynum { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .cal-entry { cursor: pointer; margin-bottom: 3px; }
    .cal-entry .pill { display: block; text-align: left; white-space: normal; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="pg-banner">🚧 Postgres migration preview — separate database from the main app, safe to click around</div>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">🏕️ <span>Camp Sychar (pg)</span></span>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close">&times;</button>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser"></div>
        <button id="logoutBtn" class="sidebar-logout" hidden>Log Out</button>
      </div>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" hidden>&#9776;</button>
        <button id="backBtn" class="icon-btn" hidden>&larr;</button>
        <h1 id="pageTitle">Camp Sychar Audit</h1>
      </header>
      <div class="global-search" id="globalSearchWrap" hidden>
        <input type="text" id="globalSearch" placeholder="Search locations & assets…" autocomplete="off" />
        <div class="global-search-results" id="globalSearchResults" hidden></div>
      </div>
      <nav id="breadcrumbs" class="breadcrumbs" hidden></nav>
      <main id="app"></main>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
